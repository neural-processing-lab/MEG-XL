# CrissCross Word Classification Evaluation Configuration - KymataSoto MEG Dataset (LINEAR PROBE)
#
# This config is for the linear probe variant:
# - CrissCross backbone is FROZEN (no gradients)
# - Only a single linear layer is trained

# Model checkpoints
model:
  # Path to pretrained CrissCrossTransformer checkpoint (backbone will be frozen)
  criss_cross_checkpoint: "./checkpoints/criss-cross-multi-dataset-pretrain-50Hz/c5z56xy8/last.ckpt"

  # Path to BioCodec tokenizer checkpoint
  tokenizer_checkpoint: "./brainstorm/neuro_tokenizers/biocodec_ckpt.pt"

  # Linear probe configuration (single linear layer)
  linear_probe:
    embed_dim: 1024  # T5-large embedding dimension

# Data settings
data:
  # Dataset type
  dataset_type: "kymatasoto"

  # Dataset root directory
  root: "/data/engs-asr/KymataSoto/english-native-english-conversation"
  cache_dir: "./data/engs-asr/KymataSoto/cache"

  # Max channel dimension (Elekta/MEGIN Triux system has 306 MEG channels)
  max_channel_dim: 306

  # Subjects to include (20 subjects + sub-E3b)
  subjects:
    - "sub-E1"
    - "sub-E2"
    - "sub-E3"
    - "sub-E3b"
    - "sub-E4"
    - "sub-E5"
    - "sub-E6"
    - "sub-E7"
    - "sub-E8"
    - "sub-E9"
    - "sub-E10"
    - "sub-E11"
    - "sub-E12"
    - "sub-E13"
    - "sub-E14"
    - "sub-E15"
    - "sub-E16"
    - "sub-E17"
    - "sub-E18"
    - "sub-E19"
    - "sub-E20"

  # Split mode: hashed sentence-based splitting
  use_hashed_split: true

  # Hashed split parameters (used when use_hashed_split=true)
  split_ratios: [0.6, 0.2, 0.2]  # train, val, test
  all_sessions:
    - "run-1"
    - "run-2"

  # Session-based temporal split (used when use_hashed_split=false)
  train_pct: 0.25
  train_sessions:
    - "run-1"

  val_sessions:
    - "run-2"

  test_sessions:
    - "run-2"

  # Tasks (unused for KymataSoto, kept for interface compatibility)
  tasks: null

  # Preprocessing parameters (must match CrissCross pretraining)
  l_freq: 0.1
  h_freq: 40.0
  target_sfreq: 50.0

  # Word window parameters
  segment_length: 150.0
  subsegment_duration: 3.0
  words_per_segment: 50
  window_onset_offset: -0.5

# T5 embedding settings
t5:
  model_name: "t5-large"
  layer: 12  # Which layer to extract embeddings from
  cache_dir: "./embeddings_cache"

# Training settings
training:
  batch_size: 1
  num_epochs: 50

  # Learning rate for linear probe only (backbone is frozen)
  probe_lr: 1.0e-3

  # Regularization
  weight_decay: 1.0e-4
  gradient_clip_val: 1.0

  # Early stopping
  patience: 10
  min_delta: 0.001

  # DataLoader settings
  num_workers: 6
  pin_memory: true

# Loss settings (SigLIP)
loss:
  norm_kind: "xy"
  temperature: true
  bias: true
  reduction: "sum"

# Evaluation settings
evaluation:
  retrieval_set_sizes: [50, 250]
  named_retrieval_sets: ["pnpl2026"]
  early_stopping_metric: "balanced_top10_accuracy_pnpl2026"
  k: 10

# Logging settings
logging:
  wandb_project: "brainstorm-eval"
  experiment_name: "criss-cross-word-classification-linear-probe-kymatasoto"
  log_every_n_steps: 10
  save_dir: "./logs/word_classification_linear_probe_kymatasoto"

# System settings
device: "cuda"
seed: 42
