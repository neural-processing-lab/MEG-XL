# CrissCross Word Classification Evaluation Configuration - Broderick 2018 EEG Dataset

# Model checkpoints
model:
  # Training mode: false = fine-tune from pretrained, true = train from scratch
  train_from_scratch: false

  # Path to pretrained CrissCrossTransformer checkpoint
  criss_cross_checkpoint: "./checkpoints/criss-cross-multi-dataset-pretrain-50Hz/c5z56xy8/last.ckpt"

  # Path to BioCodec tokenizer checkpoint
  tokenizer_checkpoint: "./brainstorm/neuro_tokenizers/biocodec_ckpt.pt"

  # Word embedding MLP configuration
  word_mlp:
    hidden_dim: 2048
    embed_dim: 1024  # T5-large embedding dimension
    dropout: 0.1

# Data settings
data:
  # Dataset type
  dataset_type: "broderick"

  # Dataset root directory
  root: "/path/to/broderick2018"
  cache_dir: "./data/cache"

  # Max channel dimension (128 EEG channels)
  max_channel_dim: 128

  # Subjects to include (19 subjects)
  subjects:
    - "sub-1"
    - "sub-2"
    - "sub-3"
    - "sub-4"
    - "sub-5"
    - "sub-6"
    - "sub-7"
    - "sub-8"
    - "sub-9"
    - "sub-10"
    - "sub-11"
    - "sub-12"
    - "sub-13"
    - "sub-14"
    - "sub-15"
    - "sub-16"
    - "sub-17"
    - "sub-18"
    - "sub-19"

  # Split mode: hashed sentence-based splitting
  use_hashed_split: true

  # Hashed split parameters (used when use_hashed_split=true)
  split_ratios: [0.8, 0.1, 0.1]  # train, val, test
  all_sessions:
    - "ses-1"
    - "ses-2"
    - "ses-3"
    - "ses-4"
    - "ses-5"
    - "ses-6"
    - "ses-7"
    - "ses-8"
    - "ses-9"
    - "ses-10"
    - "ses-11"
    - "ses-12"
    - "ses-13"
    - "ses-14"
    - "ses-15"
    - "ses-16"
    - "ses-17"
    - "ses-18"
    - "ses-19"
    - "ses-20"

  # Session-based temporal split (used when use_hashed_split=false)
  train_pct: 0.25
  train_sessions:
    - "ses-1"
    - "ses-2"
    - "ses-3"
    - "ses-4"
    - "ses-5"
    - "ses-6"
    - "ses-7"
    - "ses-8"
    - "ses-9"
    - "ses-10"
    - "ses-11"
    - "ses-12"
    - "ses-13"
    - "ses-14"
    - "ses-15"
    - "ses-16"

  val_sessions:
    - "ses-17"
    - "ses-18"

  test_sessions:
    - "ses-19"
    - "ses-20"

  # Tasks
  tasks:
    - "natural"

  # Preprocessing parameters (must match CrissCross pretraining)
  l_freq: 0.1
  h_freq: 40.0
  target_sfreq: 50.0

  # Word window parameters
  segment_length: 150.0
  subsegment_duration: 3.0
  words_per_segment: 50
  window_onset_offset: -0.5

# T5 embedding settings
t5:
  model_name: "t5-large"
  layer: 12  # Which layer to extract embeddings from
  cache_dir: "./embeddings_cache"

# Training settings
training:
  batch_size: 1
  num_epochs: 50

  # Learning rates for different training modes
  criss_cross_lr: 1.0e-5  # Small LR to preserve pretrained features
  word_mlp_lr: 1.0e-3     # Larger LR for learning from scratch

  # From-scratch mode (train_from_scratch=true): use same LR for all components
  from_scratch_lr: 1.0e-4

  # Regularization
  weight_decay: 1.0e-4
  gradient_clip_val: 1.0

  # Early stopping
  patience: 10
  min_delta: 0.001

  # DataLoader settings
  num_workers: 6
  pin_memory: true

# Loss settings (SigLIP)
loss:
  norm_kind: "xy"
  temperature: true
  bias: true
  reduction: "sum"

# Evaluation settings
evaluation:
  retrieval_set_sizes: [50, 250]
  k: 10

# Logging settings
logging:
  wandb_project: "brainstorm-eval"
  experiment_name: "criss-cross-word-classification-broderick-50Hz"
  log_every_n_steps: 10
  save_dir: "./logs/word_classification_broderick"

# System settings
device: "cuda"
seed: 42
