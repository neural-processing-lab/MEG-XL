defaults:
  - eval_criss_cross_word_classification_libribrain100
  - _self_

# LibriBrain100 multi-subject Sherlock1 fine-tuning.
# Subjects 1-32 only; subject 0 is intentionally excluded.
data:
  subjects:
    - "sub-1"
    - "sub-2"
    - "sub-3"
    - "sub-4"
    - "sub-5"
    - "sub-6"
    - "sub-7"
    - "sub-8"
    - "sub-9"
    - "sub-10"
    - "sub-11"
    - "sub-12"
    - "sub-13"
    - "sub-14"
    - "sub-15"
    - "sub-16"
    - "sub-17"
    - "sub-18"
    - "sub-19"
    - "sub-20"
    - "sub-21"
    - "sub-22"
    - "sub-23"
    - "sub-24"
    - "sub-25"
    - "sub-26"
    - "sub-27"
    - "sub-28"
    - "sub-29"
    - "sub-30"
    - "sub-31"
    - "sub-32"
  tasks:
    - "Sherlock1"
  sherlock1_session11_half_train: true

evaluation:
  primary_metric: "balanced_top10_accuracy_datafit50"
  random_noise_test:
    enabled: false
    mode: "matched_gaussian_per_sample_channel"

logging:
  experiment_name: "criss-cross-word-classification-libribrain100-multisub-train-50Hz"
  save_dir: "./logs/word_classification_libribrain100_multisub_train"
